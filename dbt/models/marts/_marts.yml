version: 2

models:
  - name: dim_employee
    description: "One row per employee (real attributes, synthetic dates)."
    columns:
      - name: employee_id
        tests: [unique, not_null]
      - name: onet_soc_code
        tests: [not_null]
  - name: fct_training
    description: "One row per course completion (synthetic)."
    columns:
      - name: training_id
        tests: [unique, not_null]
      - name: cost_gbp
        tests: [not_null]
  - name: rpt_training_cost_per_employee
    description: "Training cost and hours per employee on payroll, by year and department."
    tests:
      - trust_tests.unique_combination:
          arguments: {columns: [training_year, department]}
  - name: rpt_competency_requirements
    description: "REAL. Top 8 O*NET skills per job role, with importance and required level."
    tests:
      - trust_tests.unique_combination:
          arguments: {columns: [job_role, skill_id]}
  - name: rpt_competency_gap_matrix
    description: "Required (real) vs achieved (synthetic model) competency by job role and skill."
    tests:
      - trust_tests.unique_combination:
          arguments: {columns: [job_role, skill_id]}
    columns:
      - name: share_meeting_requirement
        tests: [not_null]
  - name: rpt_attrition_by_training
    description: "REAL. Attrition rate by last-year training band, overall and by department."
    tests:
      - trust_tests.unique_combination:
          arguments: {columns: [department, training_band]}
  - name: fct_application
    description: "SYNTHETIC. One row per application: furthest stage reached, stage dates, days to offer and to start."
    columns:
      - name: application_id
        data_tests: [unique, not_null]
  - name: rpt_recruitment_funnel
    description: "SYNTHETIC. Applications reaching each stage, with conversion, by role, by source channel and overall."
    data_tests:
      - trust_tests.unique_combination:
          arguments: {columns: [cut, segment, stage]}
  - name: rpt_interviewer_calibration
    description: "SYNTHETIC. Each interviewer's average offset from their co-panellists, with a 95% CI and a calibration flag."
    columns:
      - name: interviewer_id
        data_tests: [unique, not_null]
  - name: fct_interview_result
    description: "SYNTHETIC. Raw and calibrated panel averages, ranks, offer decisions and first-year outcomes."
    columns:
      - name: application_id
        data_tests: [unique, not_null]
