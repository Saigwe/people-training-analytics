# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 2020
tables:
  - name: departments
    pk: department_id
    data:
      columns: [department_id, department_name]
      rows:
        - [D01, Network Operations]
        - [D02, Metering]
        - [D03, Customer Service]
        - [D04, Finance]
        - [D05, Human Resources]
  - name: employees
    rows: 600
    pk: employee_id
    fk: {department_id: departments.department_id}
    cast: {hire_date: date, leave_date: date}
    columns:
      employee_id: {type: id, prefix: EMP}
      department_id: {type: fk, table: departments, column: department_id}
      job_family: {type: choice, values: [technician, engineer, sales_rep, analyst, manager], p: [0.4, 0.15, 0.25, 0.1, 0.1]}
      hire_date: {type: date, start: 2015-01-01, end: 2024-06-30}
      leave_date: {type: expr, expr: "(df.hire_date + pd.to_timedelta(rng.integers(200, 3000, n), unit='D')).where((rng.random(n) < 0.2))"}
  - name: trainings
    rows: 3000
    pk: training_id
    fk: {employee_id: employees.employee_id}
    cast: {training_date: date}
    columns:
      training_id: {type: id, prefix: TR}
      employee_id: {type: fk, table: employees, column: employee_id}
      training_date: {type: expr, expr: "df.employee_id.map(tables['employees'].set_index('employee_id').hire_date) + pd.to_timedelta(rng.integers(0, 700, n), unit='D')"}
      course: {type: choice, values: [Safety, Metering basics, Customer care, Excel and SQL, Leadership]}
      cost_usd: {type: float, dist: lognormal, mean: 5.0, sigma: 0.5}
      hours: {type: int, low: 2, high: 40}
